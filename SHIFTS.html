const {useState,useCallback,useMemo,useRef,useEffect}=React;

const LOCS=['Oseyo',"McDonald's",'Other'];
const LCOL={'Oseyo':'#38bdf8',"McDonald's":'#facc15','Other':'#f472b6'};
const LICO={'Oseyo':'🍜',"McDonald's":'🍟','Other':'📍'};

// Generate a consistent color for custom venues not in LCOL
const OTHER_PALETTE=['#f472b6','#a78bfa','#34d399','#fb923c','#38bdf8','#e879f9','#facc15','#4ade80','#f87171','#60a5fa','#c084fc','#2dd4bf'];
function venueColor(name){
  if(LCOL[name])return LCOL[name];
  let h=0;for(let i=0;i<name.length;i++){h=(h*31+name.charCodeAt(i))>>>0;}
  return OTHER_PALETTE[h%OTHER_PALETTE.length];
}

const uid=()=>crypto.randomUUID();

function useSwipeRef(onLeft,onRight){
  const cbL=useRef(onLeft),cbR=useRef(onRight);
  useEffect(()=>{cbL.current=onLeft;},[onLeft]);
  useEffect(()=>{cbR.current=onRight;},[onRight]);
  const cleanupRef=useRef(null);
  const ref=useCallback(el=>{
    if(cleanupRef.current){cleanupRef.current();cleanupRef.current=null;}
    if(!el)return;
    let sx=null,sy=null,fired=false;
    function onTS(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;fired=false;}
    function onTM(e){
      if(sx===null)return;
      const dx=e.touches[0].clientX-sx;
      const dy=e.touches[0].clientY-sy;
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){e.preventDefault();}
    }
    function onTE(e){
      if(sx===null||fired)return;
      const dx=e.changedTouches[0].clientX-sx;
      const dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){
        fired=true;
        if(dx<0)cbL.current();else cbR.current();
      }
      sx=null;sy=null;
    }
    el.addEventListener('touchstart',onTS,{passive:true});
    el.addEventListener('touchmove',onTM,{passive:false});
    el.addEventListener('touchend',onTE,{passive:true});
    cleanupRef.current=()=>{
      el.removeEventListener('touchstart',onTS);
      el.removeEventListener('touchmove',onTM);
      el.removeEventListener('touchend',onTE);
    };
  },[]);
  return ref;
}
const fmtH=h=>{const w=Math.floor(h),m=Math.round((h-w)*60);return m?`${w}h ${m}m`:`${w}h`;};
const fmtP=n=>`£${n.toFixed(2)}`;
const RATE=11;
const shiftPay=s=>s.hours*RATE;
function calcH(s,e){
  if(!s||!e)return 0;
  const[sh,sm]=s.split(':').map(Number);let[eh,em]=e.split(':').map(Number);
  let a=sh*60+sm,b=eh*60+em;
  if(e==='0:00'||e==='00:00')b=1440;
  if(b<=a)b+=1440;
  return Math.round((b-a)/60*100)/100;
}
function applyBreak(loc,h){
  if(loc==='Oseyo'&&h>0){
    return h>9?h-1:h-0.5;
  }
  if(loc==="McDonald's"&&h>0){
    return h>6?h-0.75:h-0.5;
  }
  return h;
}
function oseyoHours(ds){
  if(!ds)return null;
  const day=new Date(ds).getDay();
  if(day===0)return{start:'11:00',end:'17:15'};
  if(day===4)return{start:'09:00',end:'20:15'};
  return{start:'09:00',end:'19:15'};
}
function fmtDateUK(ds){const[y,m,d]=ds.split('-');return`${d}/${m}/${y}`;}
function fmtTime12(t){
  if(!t)return'';
  let[h,m]=t.split(':').map(Number);
  const ap=h>=12?'PM':'AM';
  let hh=h%12;if(hh===0)hh=12;
  return`${hh}:${String(m).padStart(2,'0')} ${ap}`;
}

async function exportOseyoTimesheet(shifts,monthKey,name,staffNumber){
  const{Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,ImageRun,WidthType,AlignmentType,BorderStyle,ShadingType,VerticalAlign}=docx;
  const rows=[...shifts].sort((a,b)=>a.date.localeCompare(b.date));
  const total=rows.reduce((s,r)=>s+r.hours,0);

  const b64=CONIFER_LOGO.split(',')[1];
  const bin=atob(b64);
  const logoBytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)logoBytes[i]=bin.charCodeAt(i);

  const cb={style:BorderStyle.SINGLE,size:2,color:'000000'};
  const borders={top:cb,bottom:cb,left:cb,right:cb};

  function cell(text,{bold=false,width,shade,align=AlignmentType.LEFT}={}){
    return new TableCell({
      width:{size:width,type:WidthType.DXA},
      borders,
      shading:shade?{fill:shade,type:ShadingType.CLEAR}:undefined,
      verticalAlign:VerticalAlign.CENTER,
      children:[new Paragraph({alignment:align,children:[new TextRun({text,bold})]})],
    });
  }

  const colW=[1700,1650,1650,2900,1300];
  const headerRow=new TableRow({children:[
    cell('Date',{bold:true,width:colW[0],shade:'F2F2F2'}),
    cell('Time In',{bold:true,width:colW[1],shade:'F2F2F2'}),
    cell('Time Out',{bold:true,width:colW[2],shade:'F2F2F2'}),
    cell('Site',{bold:true,width:colW[3],shade:'F2F2F2'}),
    cell('Hours',{bold:true,width:colW[4],shade:'F2F2F2',align:AlignmentType.CENTER}),
  ]});

  const dataRows=rows.map(r=>new TableRow({children:[
    cell(fmtDateUK(r.date),{width:colW[0]}),
    cell(fmtTime12(r.start),{width:colW[1]}),
    cell(fmtTime12(r.end),{width:colW[2]}),
    cell('Oseyo - Newcastle',{width:colW[3]}),
    cell(fmtH(r.hours),{width:colW[4],align:AlignmentType.CENTER}),
  ]}));

  const totalRow=new TableRow({children:[
    new TableCell({
      width:{size:colW[0]+colW[1]+colW[2]+colW[3],type:WidthType.DXA},
      columnSpan:4,
      borders,
      children:[new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({text:'Total Hours:',bold:true})]})],
    }),
    cell(fmtH(total),{bold:true,width:colW[4],align:AlignmentType.CENTER}),
  ]});

  const mainTable=new Table({
    width:{size:colW.reduce((a,b)=>a+b,0),type:WidthType.DXA},
    columnWidths:colW,
    rows:[headerRow,...dataRows,totalRow],
  });

  const infoColW=[1100,3900,1800,2400];
  const infoTable=new Table({
    width:{size:infoColW.reduce((a,b)=>a+b,0),type:WidthType.DXA},
    columnWidths:infoColW,
    rows:[new TableRow({children:[
      cell('Name:',{bold:true,width:infoColW[0]}),
      cell(name||'',{width:infoColW[1]}),
      cell('Staff Number:',{bold:true,width:infoColW[2]}),
      cell(staffNumber||'',{width:infoColW[3]}),
    ]})],
  });

  const doc=new Document({
    sections:[{
      properties:{page:{size:{width:11906,height:16838},margin:{top:1000,bottom:1000,left:1000,right:1000}}},
      children:[
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:200},children:[new ImageRun({type:'png',data:logoBytes,transformation:{width:160,height:Math.round(160*139/290)}})]}),
        new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:300},children:[new TextRun({text:'TIME SHEET',bold:true,size:44})]}),
        infoTable,
        new Paragraph({text:'',spacing:{after:200}}),
        mainTable,
        new Paragraph({text:'',spacing:{before:300}}),
        new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:'126 Tooting High Street, London, England, SW17 0RR | 020 7183 5347 | info@conifergb.com | www.coniferfb.com',size:18})]}),
        new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:'Conifer is the trading name for Conifer Global LTD| Company Number 0793471 | VAT Number 129448492',size:18})]}),
      ],
    }],
  });

  const blob=await Packer.toBlob(doc);
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`Oseyo_Timesheet_${monthKey}.docx`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function wkNum(ds){const d=new Date(ds);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-(3-(w1.getDay()+6)%7))/7);}

/* ── FIXED CUSTOM PERIOD (replaces tax-year) ──
   Weeks are counted from PERIOD_START in 7-day blocks, not calendar/ISO weeks. */
const PERIOD_START='2026-08-03';
const PERIOD_END='2027-11-07';
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
const PERIOD_TOTAL_WEEKS=Math.floor((daysBetween(PERIOD_START,PERIOD_END)+1)/7); // computed dynamically from PERIOD_START/END (66 weeks for 3 Aug 2026 - 7 Nov 2027)
function inPeriod(ds){return ds>=PERIOD_START&&ds<=PERIOD_END;}
// which period-week (1-based) a date falls into, relative to PERIOD_START
function periodWeekNum(ds){return Math.floor(daysBetween(PERIOD_START,ds)/7)+1;}
function mkKey(ds){return ds.slice(0,7);}
function mkName(mk){const[y,m]=mk.split('-');return`${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${y}`;}
function dayName(ds){return['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(ds).getDay()];}
function localDateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${day}`;}
const TODAY=localDateStr(new Date());

function calDays(mk){
  const[y,m]=mk.split('-').map(Number);
  const first=new Date(y,m-1,1);
  const totalDays=new Date(y,m,0).getDate();
  const off=(first.getDay()+6)%7; // Mon=0 offset
  const days=[];
  const pad=n=>String(n).padStart(2,'0');
  // blank cells for padding (no date)
  for(let i=0;i<off;i++){days.push({date:null,cur:false});}
  // actual month days — build date string directly to avoid UTC shift
  for(let i=1;i<=totalDays;i++){days.push({date:`${y}-${pad(m)}-${pad(i)}`,cur:true});}
  // trailing blank cells to complete the grid row
  while(days.length%7){days.push({date:null,cur:false});}
  return days;
}

/* ── 24H TIME INPUT ── */
function TimeInput({value, onChange, placeholder='HH:MM', className}){
  const[raw,setRaw]=useState(value||'');

  // Keep in sync if parent value changes (e.g. reset)
  useEffect(()=>{setRaw(value||'');},[value]);

  function handleChange(e){
    let v=e.target.value.replace(/[^0-9:]/g,'');
    // Auto-insert colon after 2 digits
    if(v.length===2&&raw.length===1&&!v.includes(':'))v=v+':';
    // Limit to HH:MM
    if(v.length>5)return;
    setRaw(v);
    // Validate & emit
    const m=v.match(/^([01]?\d|2[0-3]):([0-5]\d)$/);
    if(m){
      const hh=m[1].padStart(2,'0'),mm=m[2];
      onChange(`${hh}:${mm}`);
    } else if(v===''){
      onChange('');
    }
  }

  function handleBlur(){
    // Try to fix partial input on blur
    const m=raw.match(/^([01]?\d|2[0-3]):([0-5]\d)$/);
    if(m){
      const fixed=`${m[1].padStart(2,'0')}:${m[2]}`;
      setRaw(fixed);
      onChange(fixed);
    } else if(raw&&!raw.match(/^([01]?\d|2[0-3]):([0-5]\d)$/)){
      // invalid — clear
      setRaw('');onChange('');
    }
  }

  function handleKeyDown(e){
    if(e.key==='Backspace'&&raw.endsWith(':'))setRaw(raw.slice(0,-1));
  }

  return(
    <input
      className={className}
      type="text"
      inputMode="numeric"
      placeholder={placeholder}
      value={raw}
      onChange={handleChange}
      onBlur={handleBlur}
      onKeyDown={handleKeyDown}
      maxLength={5}
      autoComplete="off"
    />
  );
}

/* weekly target progress */

/* save flash */
@keyframes savePop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.25rem;}
.mdl{background:var(--bg);border:1px solid var(--border);padding:1rem;width:100%;max-width:340px;animation:pop .2s ease;border-radius:9px;max-height:90vh;overflow-y:auto;}

.mdl-i-sm:focus{outline:none;border-color:var(--accent);}

.mdl-lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;}
.mdl-lbtn{display:flex;align-items:center;gap:.25rem;padding:.45rem .35rem;border:1px solid var(--border2);background:var(--s2);cursor:pointer;font-family:var(--font-b);font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;border-radius:4px;transition:all .15s;}
.mdl-lbtn.sel{background:rgba(255,255,255,.05);}
.mdl-notes{width:100%;background:var(--s3);border:1px solid var(--border2);color:var(--text);font-family:var(--font-m);font-size:.78rem;padding:.48rem .65rem;border-radius:4px;resize:none;line-height:1.4;}
.mdl-notes:focus{outline:none;border-color:var(--accent);}
.mdl-notes::placeholder{color:var(--muted);}
.mdl-save{width:100%;font-family:var(--font-d);font-size:1.3rem;letter-spacing:.1em;padding:.75rem;border:none;cursor:pointer;background:var(--green);color:#fff;border-radius:5px;margin-top:.25rem;transition:all .15s;}
.mdl-save:disabled{background:var(--green);color:#fff;cursor:default;opacity:1;}
.mdl-save.edit{background:var(--green);color:#fff;}
.mdl-del{width:100%;font-family:var(--font-d);font-size:1rem;letter-spacing:.08em;padding:.6rem;border:none;background:var(--red);color:#fff;cursor:pointer;border-radius:5px;margin-top:.4rem;transition:all .15s;}
`;

/* ── EDIT MODAL ── */
function EditModal({shift, onSave, onDelete, onClose}){
  const isNew=!shift.id;
  const[date,setDate]=useState(shift.date);
  const[s0,setS0]=useState(shift.start||'');
  const[e0,setE0]=useState(shift.end||'');
  // If existing shift has a loc not in LOCS, treat as custom Other
  const knownLoc=shift.loc&&LOCS.includes(shift.loc);
  const[loc,setLoc]=useState(!shift.loc?'':(knownLoc?shift.loc:'Other'));
  const[otherName,setOtherName]=useState(knownLoc||!shift.loc?'':(shift.loc||''));
  const[note,setNote]=useState(shift.note||'');
  const finalLoc=loc==='Other'?(otherName.trim()||'Other'):(loc||'');
  const pH=applyBreak(finalLoc,calcH(s0,e0)),pP=pH*RATE;
  function doSave(){
    if(!s0||!e0||calcH(s0,e0)<=0)return;
    const h=applyBreak(finalLoc,calcH(s0,e0));
    onSave({...shift,id:shift.id||uid(),date,start:s0,end:e0,loc:finalLoc,hours:h,note});
  }
  return(
    <div className="mo" onClick={onClose}>
      <div className="mdl" onClick={e=>e.stopPropagation()}>
        <div className="mdl-t">{isNew?'ADD SHIFT':'EDIT SHIFT'}</div>
        <div className="mdl-s">{isNew?`${dayName(date)} · ${+date.slice(8)} ${mkName(date.slice(0,7))}`:'Update the details below'}</div>

        {/* DATE box */}
        <div className="mdl-box">
          <div className="mdl-l">DATE</div>
          <input className="mdl-i-sm" type="date" value={date} onChange={e=>{
            const nd=e.target.value;setDate(nd);
            if(loc==='Oseyo'){const oh=oseyoHours(nd);if(oh){setS0(oh.start);setE0(oh.end);}}
          }}/>
        </div>

        {/* SHIFT TIME box */}
        <div className="mdl-box">
          <div className="mdl-l">SHIFT TIME</div>
          <div className="mdl-trow">
            <TimeInput className="mdl-i-sm" value={s0} onChange={setS0} placeholder="09:00"/>
            <div className="mdl-tsep">→</div>
            <TimeInput className="mdl-i-sm" value={e0} onChange={setE0} placeholder="17:00"/>
          </div>
          {s0&&e0&&calcH(s0,e0)>0&&<div style={{marginTop:'.35rem',fontFamily:'var(--font-m)',fontSize:'.63rem',color:'var(--accent)'}}>{fmtH(pH)} · {fmtP(pP)}{finalLoc==='Oseyo'&&<span style={{color:'var(--muted)'}}> ({calcH(s0,e0)>9?'60':'30'}m unpaid break deducted)</span>}{finalLoc==="McDonald's"&&<span style={{color:'var(--muted)'}}> ({calcH(s0,e0)>6?'45':'30'}m unpaid break deducted)</span>}</div>}
        </div>

        {/* LOCATION box */}
        <div className="mdl-box">
          <div className="mdl-l">LOCATION</div>
          <div className="mdl-lgrid">
            {LOCS.map(l=>{
              const isSel=loc===l;
              const col=LCOL[l]||LCOL['Other'];
              return(
              <div key={l} className={`mdl-lbtn ${isSel?'sel':''}`}
                style={isSel?{borderColor:col,color:col}:{}}
                onClick={()=>{
                  if(l==='Other'){setLoc('Other');setOtherName('');}
                  else{
                    setLoc(l);setOtherName('');
                    if(l==='Oseyo'){const oh=oseyoHours(date);if(oh){setS0(oh.start);setE0(oh.end);}}
                  }
                }}>
                <span>{LICO[l]}</span>{l}
              </div>);
            })}
          </div>
          {loc==='Other'&&<input
            className="mdl-i-sm"
            style={{marginTop:'.5rem',width:'100%'}}
            type="text"
            placeholder="Enter venue name..."
            value={otherName}
            onChange={e=>setOtherName(e.target.value)}
            autoFocus
          />}
        </div>

        {/* NOTES box */}
        <div className="mdl-box">
          <div className="mdl-l">NOTES (OPTIONAL)</div>
          <textarea className="mdl-notes" rows={2} value={note} onChange={e=>setNote(e.target.value)} placeholder=""/>
        </div>

        {!isNew ? (
          <div style={{display:'flex',gap:'.5rem',marginTop:'.25rem'}}>
            <button className="mdl-del" style={{margin:0,flex:1}} onClick={()=>onDelete(shift.id)}>DELETE</button>
            <button className="mdl-save edit" style={{flex:1,marginTop:0}} disabled={!s0||!e0||calcH(s0,e0)<=0} onClick={doSave}>SAVE</button>
          </div>
        ) : (
          <button className="mdl-save" disabled={!s0||!e0||calcH(s0,e0)<=0} onClick={doSave}>SAVE</button>
        )}
      </div>
    </div>
  );
}

/* ── SHIFT ROW — tap to edit ── */
function ShiftRow({s, onEdit}){
  const isEvent=!s.loc;
  const col=isEvent?'var(--muted)':venueColor(s.loc);
  const fmt24=t=>{if(!t)return'';const[h,m]=t.split(':');return`${h.padStart(2,'0')}:${m.padStart(2,'0')}`;};
  return(
    <div className="sr-wrap">
      <div className="sr" onClick={()=>onEdit(s)}>
        <div className="sr-bar" style={{background:col}}/>
        <div className="sr-info">
          <div className="sr-line">
            <span className="sr-time">{fmt24(s.start)} – {fmt24(s.end)}</span>
            <span className="sr-dot">·</span>
            <span className="sr-ico">{isEvent?'📌':LICO[s.loc]}</span>
            <span className="sr-venue" style={{color:col}}>{isEvent?(s.note||'EVENT'):s.loc}</span>
          </div>
          {s.note&&!isEvent&&<div className="sr-note">📝 {s.note}</div>}
        </div>
        <div className="sr-right">
          <div className="sr-hrs" style={{color:col}}>{fmtH(s.hours)}</div>
          {!isEvent&&<div className="sr-pay">{fmtP(shiftPay(s))}</div>}
        </div>
      </div>
    </div>
  );
}

/* ── SALARY ROW — double-tap to edit ── */
function SalaryRow({m, actual, isPastMonth, up}){
  const[editing,setEditing]=useState(false);
  const lastTap=useRef(0);
  function handleTap(){
    const now=Date.now();
    if(now-lastTap.current<350){setEditing(true);}
    lastTap.current=now;
  }
  return(
    <div key={m.k} style={{marginBottom:'.5rem',padding:'.6rem .75rem',background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'6px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'.75rem'}}>
        <div style={{flex:'0 0 auto'}}>
          <div style={{fontFamily:'var(--font-b)',fontWeight:700,fontSize:'.95rem',color:'var(--text)'}}>{mkName(m.k)}</div>
          {isPastMonth&&<div style={{fontFamily:'var(--font-m)',fontSize:'.48rem',color:'var(--muted)',marginTop:'1px',letterSpacing:'.04em'}}>MONTH OVER</div>}
        </div>
        <div style={{flex:1,display:'flex',alignItems:'center',gap:'.4rem',justifyContent:'flex-end'}}>
          {actual!==''&&!editing
            ? <span style={{fontFamily:'var(--font-d)',fontSize:'1.2rem',color:'var(--sky)',cursor:'pointer',userSelect:'none'}} onClick={handleTap} title="Double-tap to edit">{fmtP(parseFloat(actual))}</span>
            : <>
                <span style={{fontFamily:'var(--font-m)',fontSize:'.75rem',color:'var(--muted)'}}>£</span>
                <input
                  type="number"
                  inputMode="decimal"
                  step="0.01"
                  min="0"
                  placeholder="0.00"
                  value={actual}
                  autoFocus={editing}
                  onChange={e=>{
                    const val=e.target.value;
                    up(st=>{if(!st.actualPay)st.actualPay={};st.actualPay={...st.actualPay,[m.k]:val===''?null:parseFloat(val)||val};});
                  }}
                  onBlur={()=>setEditing(false)}
                  style={{width:'100px',background:'var(--s3)',border:'1px solid var(--border2)',color:'var(--text)',fontFamily:'var(--font-d)',fontSize:'1.1rem',padding:'.35rem .5rem',borderRadius:'4px',textAlign:'right',outline:'none'}}
                  onFocus={e=>e.target.style.borderColor='var(--sky)'}
                />
              </>
          }
        </div>
      </div>
    </div>
  );
}

  }
  return(
    <div style={{marginBottom:'.5rem',padding:'.6rem .75rem',background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'6px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'.75rem'}}>
        <div style={{flex:'0 0 auto'}}>
          <div style={{fontFamily:'var(--font-b)',fontWeight:700,fontSize:'.95rem',color:'var(--text)'}}>{mkName(m.k)}</div>
          {isPastMonth&&<div style={{fontFamily:'var(--font-m)',fontSize:'.48rem',color:'var(--muted)',marginTop:'1px',letterSpacing:'.04em'}}>MONTH OVER</div>}
        </div>
        <div style={{flex:1,display:'flex',alignItems:'center',gap:'.4rem',justifyContent:'flex-end'}}>
          {invest!==''&&!editing
            ? <span style={{fontFamily:'var(--font-d)',fontSize:'1.2rem',color:'var(--green)',cursor:'pointer',userSelect:'none'}} onClick={handleTap} title="Double-tap to edit">{fmtP(parseFloat(invest))}</span>
            : <>
                <span style={{fontFamily:'var(--font-m)',fontSize:'.75rem',color:'var(--muted)'}}>£</span>
                <input
                  type="number"
                  inputMode="decimal"
                  step="0.01"
                  min="0"
                  placeholder="0.00"
                  value={invest}
                  autoFocus={editing}
                  onChange={e=>{
                    const val=e.target.value;
                    up(st=>{if(!st.investment)st.investment={};st.investment={...st.investment,[m.k]:val===''?null:parseFloat(val)||val};});
                  }}
                  onBlur={()=>setEditing(false)}
                  style={{width:'100px',background:'var(--s3)',border:'1px solid var(--border2)',color:'var(--text)',fontFamily:'var(--font-d)',fontSize:'1.1rem',padding:'.35rem .5rem',borderRadius:'4px',textAlign:'right',outline:'none'}}
                  onFocus={e=>e.target.style.borderColor='var(--green)'}
                />
              </>
          }
        </div>
      </div>
    </div>
  );
}

function App(){
  const[store,setStore]=useState(()=>loadStore());
  const[tab,setTab]=useState('week');
  function switchTab(id){setTab(id);}
  const[wOff,setWOff]=useState(0);
  const[vm,setVm]=useState(()=>new Date().toISOString().slice(0,7));
  const[sel,setSel]=useState(null);
  const[editShift,setEditShift]=useState(null);
  const[saveFlash,setSaveFlash]=useState(false);
  const[selLoc,setSelLoc]=useState(null);
  const[showWkBreak,setShowWkBreak]=useState(false);
  const[showActualPay,setShowActualPay]=useState(false);
  const[showInvestment,setShowInvestment]=useState(false);

  const shifts=store.shifts,weeklyTarget=store.weeklyTarget||0;
  // Shifts with no venue selected are just calendar "events" — exclude them from all hours/shift-count totals.
  const workShifts=useMemo(()=>shifts.filter(s=>s.loc),[shifts]);

  const up=useCallback(fn=>{
    setStore(p=>{const n={...p,shifts:[...p.shifts]};fn(n);saveStore(n);return{...n};});
  },[]);

  const delShift=id=>up(st=>{st.shifts=st.shifts.filter(x=>x.id!==id);setEditShift(null);});

  function saveEdit(updated){
    up(st=>{
      const exists=st.shifts.some(x=>x.id===updated.id);
      if(exists){
        st.shifts=st.shifts.map(x=>x.id===updated.id?updated:x);
      } else {
        st.shifts=[...st.shifts,updated];
      }
      st.shifts=st.shifts.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
    });
    setEditShift(null);
    setSaveFlash(true);setTimeout(()=>setSaveFlash(false),400);
  }

  const wStart=useMemo(()=>{
    const d=new Date(TODAY),day=d.getDay(),m=new Date(d);
    m.setDate(d.getDate()-(day===0?6:day-1)+wOff*7);
    return localDateStr(m);
  },[wOff]);

  const wDates=useMemo(()=>{
    const a=[];for(let i=0;i<7;i++){const d=new Date(wStart);d.setDate(d.getDate()+i);a.push(localDateStr(d));}return a;
  },[wStart]);

  const wShifts=useMemo(()=>shifts.filter(s=>wDates.includes(s.date)),[shifts,wDates]);
  const wWorkShifts=useMemo(()=>workShifts.filter(s=>wDates.includes(s.date)),[workShifts,wDates]);
  const wHours=useMemo(()=>wWorkShifts.reduce((a,s)=>a+s.hours,0),[wWorkShifts]);
  const wPay=useMemo(()=>wWorkShifts.reduce((a,s)=>a+shiftPay(s),0),[wWorkShifts]);
  const wByDay=useMemo(()=>{const m={};wDates.forEach(d=>{m[d]=wShifts.filter(s=>s.date===d);});return m;},[wDates,wShifts]);

  const mShifts=useMemo(()=>shifts.filter(s=>s.date.startsWith(vm)),[shifts,vm]);
  const mWorkShifts=useMemo(()=>workShifts.filter(s=>s.date.startsWith(vm)),[workShifts,vm]);
  const mHours=useMemo(()=>mWorkShifts.reduce((a,s)=>a+s.hours,0),[mWorkShifts]);
  const mPay=useMemo(()=>mWorkShifts.reduce((a,s)=>a+shiftPay(s),0),[mWorkShifts]);

  const mByWeek=useMemo(()=>{
    const m={};
    mWorkShifts.forEach(s=>{const w=wkNum(s.date);if(!m[w])m[w]={w,hours:0,shifts:[],dates:[],pay:0};m[w].hours+=s.hours;m[w].pay+=shiftPay(s);m[w].shifts.push(s);if(!m[w].dates.includes(s.date))m[w].dates.push(s.date);});
    return Object.values(m).sort((a,b)=>a.w-b.w);
  },[mWorkShifts]);
  const maxWH=useMemo(()=>Math.max(1,...mByWeek.map(w=>w.hours)),[mByWeek]);

  const mLoc=useMemo(()=>{const m={};mWorkShifts.forEach(s=>{m[s.loc]=(m[s.loc]||0)+s.hours;});return m;},[mWorkShifts]);
  const maxLH=useMemo(()=>Math.max(1,...Object.values(mLoc)),[mLoc]);

  function chMon(d){
    const[y,m]=vm.split('-').map(Number),nd=new Date(y,m-1+d,1);
    setVm(`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`);setSel(null);
  }

  const weekRef=useSwipeRef(
    ()=>setWOff(o=>o<0?0:o+1),
    ()=>setWOff(o=>o<=0?-1:o-1)
  );
  const pastWeekRef=useSwipeRef(()=>setWOff(0),()=>{});
  const monthRef=useSwipeRef(()=>chMon(1),()=>chMon(-1));
  const cDays=useMemo(()=>calDays(vm),[vm]);
  const sByDate=useMemo(()=>{const m={};shifts.forEach(s=>{if(!m[s.date])m[s.date]=[];m[s.date].push(s);});return m;},[shifts]);
  const selS=sel?(sByDate[sel]||[]):[];
  const selH=selS.reduce((a,s)=>a+(s.loc?s.hours:0),0);

  return(<>
    <style dangerouslySetInnerHTML={{__html:CSS}}/>
    <div className="app">

      <div className="topbar">
        <div className="tb-inner" style={{justifyContent:'flex-start',position:'relative'}}>
          <div className="title">SHI<span>FT</span>S</div>
          {tab==='week'&&<div onClick={wOff!==0?()=>setWOff(0):undefined} style={{position:'absolute',left:'50%',transform:'translateX(-50%)',textAlign:'center',cursor:wOff!==0?'pointer':'default',userSelect:'none'}}>
            <div style={{fontFamily:'var(--font-d)',fontSize:'1.2rem',letterSpacing:'.06em',color:wOff<0?'var(--accent)':wOff>0?'var(--sky)':'var(--text)',lineHeight:1,textAlign:'center'}}>{wOff<0?'PAST WEEKS':wOff===0?'THIS WEEK':`${wOff} WK${wOff>1?'S':''} AHEAD`}</div>
          </div>}
          {tab==='monthly'&&<div onClick={vm!==new Date().toISOString().slice(0,7)?()=>{setVm(new Date().toISOString().slice(0,7));setSel(null);}:undefined} style={{position:'absolute',left:'50%',transform:'translateX(-50%)',textAlign:'center',cursor:vm!==new Date().toISOString().slice(0,7)?'pointer':'default',userSelect:'none'}}>
            <div style={{fontFamily:'var(--font-d)',fontSize:'1.2rem',letterSpacing:'.06em',color:vm!==new Date().toISOString().slice(0,7)?'var(--gold)':'var(--text)',lineHeight:1,transition:'color .2s',textAlign:'center'}}>{mkName(vm)}</div>
          </div>}

        </div>
      </div>

      {/* WEEK */}
      {tab==='week'&&(wOff<0?(()=>{
        // PAST VIEW — scrollable list of all past weeks
        const now=new Date(TODAY),day=now.getDay(),mon=new Date(now);
        mon.setDate(now.getDate()-(day===0?6:day-1));
        const thisWkStart=localDateStr(mon);
        const pastShifts=workShifts.filter(s=>s.date<thisWkStart);
        const pastWkMap={};
        pastShifts.forEach(s=>{
          const d=new Date(s.date),dday=d.getDay(),m2=new Date(d);
          m2.setDate(d.getDate()-(dday===0?6:dday-1));
          const wkStart=localDateStr(m2);
          const wn=wkNum(s.date);
          const key=wkStart;
          if(!pastWkMap[key])pastWkMap[key]={key,wn,wkStart,hours:0};
          pastWkMap[key].hours+=s.hours;
        });
        const pastWks=Object.values(pastWkMap).sort((a,b)=>b.wkStart.localeCompare(a.wkStart));
        return(
        <div className="screen" ref={pastWeekRef}><div className="w-wrap">
          <div style={{marginBottom:'.65rem'}}></div>
          {pastWks.length===0&&<div style={{background:'var(--s1)',border:'1px dashed var(--border2)',borderRadius:'8px',padding:'2rem',textAlign:'center'}}>
            <div style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',color:'var(--muted)',letterSpacing:'.08em'}}>NO PAST SHIFTS</div>
          </div>}
          <div className="stg">
          {pastWks.map(w=>(
            <div key={w.key} className="stc" style={{borderTop:'2px solid var(--purple)',display:'flex',padding:0,overflow:'hidden'}}>
              <div style={{flex:1,padding:'.9rem',borderRight:'1px solid var(--border)',textAlign:'center'}}>
                <div className="stv" style={{color:'var(--text)',textAlign:'center'}}>{w.wn}</div>
                <div className="stl" style={{textAlign:'center'}}>WEEK</div>
              </div>
              <div style={{flex:1,padding:'.9rem',textAlign:'center'}}>
                <div className="stv" style={{color:'var(--purple)',textAlign:'center',fontSize:'1.4rem'}}>{fmtH(w.hours)}</div>
                <div className="stl" style={{textAlign:'center'}}>HOURS</div>
              </div>
            </div>
          ))}
          </div>
        </div></div>
        );
      })():(
      <div className="screen" ref={weekRef}><div className="w-wrap">
        <div className="who">
          <div className="wc" style={{borderTop:'2px solid var(--accent)'}}><div className="wcv" style={{color:'var(--accent)'}}>{fmtH(wHours)}</div><div className="wcl">TOTAL HRS</div></div>
          <div className="wc" style={{borderTop:'2px solid var(--green)'}}><div className="wcv" style={{color:'var(--green)',fontSize:'1.3rem'}}>{wHours>0?fmtP(wPay):'£0.00'}</div><div className="wcl">GROSS PAY</div></div>
          <div className="wc" style={{borderTop:'2px solid var(--gold)'}}><div className="wcv" style={{color:'var(--gold)'}}>{wWorkShifts.length}</div><div className="wcl">SHIFTS</div></div>
          <div className="wc" style={{borderTop:'2px solid var(--purple)'}}>
            <input
              type="text"
              inputMode="numeric"
              pattern="[0-9]*"
              value={store.application&&store.application[wStart]!=null?store.application[wStart]:''}
              onChange={e=>{
                const raw=e.target.value.replace(/[^0-9]/g,'');
                up(st=>{if(!st.application)st.application={};st.application={...st.application,[wStart]:raw===''?null:raw};});
              }}
              placeholder="0"
              className="wcv"
              style={{color:'var(--purple)',background:'transparent',border:'none',outline:'none',width:'100%',textAlign:'center',padding:0}}
            />
            <div className="wcl">APPLICATION</div>
          </div>
        </div>

        {weeklyTarget>0&&(()=>{const pct=Math.min(100,wHours/weeklyTarget*100),done=wHours>=weeklyTarget,rem=Math.max(0,weeklyTarget-wHours);return(
          <div className="wtarget">
            <div className="wt-row">
              <span className="wt-lbl">WEEKLY TARGET · {fmtH(weeklyTarget)}</span>
              <span className="wt-val">{done?'✓ DONE':`${fmtH(rem)} left`}</span>
            </div>
            <div className="wt-bar">
              <div className="wt-fill" style={{width:`${pct}%`,background:done?'var(--green)':'var(--purple)'}}/>
            </div>
          </div>
        );})()}

        {[...wDates].sort((a,b)=>{
          const aP=a<TODAY,bP=b<TODAY;
          if(aP&&!bP)return 1;
          if(!aP&&bP)return -1;
          return a.localeCompare(b);
        }).map(d=>{
          const ds=wByDay[d]||[],dh=ds.reduce((a,s)=>a+(s.loc?s.hours:0),0),has=ds.length>0,isT=d===TODAY,isPast=d<TODAY;
          if(isPast&&!has)return null;
          return<div key={d} className={`db${isT?' td':''}`}>
            <div className="dbh" style={{cursor:'pointer'}} onClick={()=>isPast?null:setEditShift({date:d,start:'',end:'',loc:'',note:''})}>
              <div style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
                <span className="dbh-d" style={{color:isT?'var(--accent)':isPast?'var(--text2)':'#38bdf8',letterSpacing:'.04em'}}>
                  {dayName(d)}
                </span>
                <span style={{fontFamily:'var(--font-m)',fontSize:'.72rem',color:isT?'var(--accent)':isPast?'var(--muted)':'#2090c0',marginLeft:'.1rem'}}>
                  {d.slice(8)} {['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+d.slice(5,7)-1]}
                </span>
                {isT&&<span className="tdtag">TODAY</span>}
              </div>
              {dh>0&&<div className="dbh-t" style={{fontSize:'1rem',color:isPast?'var(--accent)':'var(--accent)'}}>{fmtH(dh)}</div>}
            </div>
            {!isPast&&<div className="db-body">
              {has
                ? ds.map(s=><ShiftRow key={s.id} s={s} onEdit={setEditShift}/>)
                : <div className="eday">no shifts</div>
              }
            </div>}
          </div>;
        })}
      </div></div>
      ))}

      {/* MONTHLY */}
      {tab==='monthly'&&<div className="screen" ref={monthRef}><div className="m-wrap">

        <div className="stat-split">
          <div className="sp" style={{borderTop:'2px solid var(--accent)'}}><div className="wcv" style={{color:'var(--accent)'}}>{fmtH(mHours)}</div><div className="wcl">TOTAL HRS</div></div>
          <div className="sp" style={{borderTop:'2px solid var(--green)'}}><div className="wcv" style={{color:'var(--green)',fontSize:'1.3rem'}}>{fmtP(mPay)}</div><div className="wcl">GROSS PAY</div></div>
          <div className="sp" style={{borderTop:'2px solid var(--purple)'}}><div className="wcv" style={{color:'var(--purple)'}}>{mWorkShifts.length}</div><div className="wcl">SHIFTS</div></div>
          <div className="sp" style={{borderTop:'2px solid var(--accent)'}}><div className="wcv" style={{color:'var(--accent)',fontSize:'1.3rem'}}>{mWorkShifts.length>0?fmtH(mHours/mWorkShifts.length):'—'}</div><div className="wcl">AVG/SHIFT</div></div>
        </div>

        {/* CALENDAR */}
        <div className="cal">
          <div className="cal-dow-row">{['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=><div key={d} className="cal-dow">{d}</div>)}</div>
          <div className="cal-grid">
            {cDays.map(({date:cd,cur},i)=>{
              if(!cd){return<div key={`blank-${i}`} className="cc om"/>;}
              const cs=sByDate[cd]||[];
              const isT=cd===TODAY,isSel=cd===sel,hasS=cs.length>0;
              const cls=['cc',hasS?'hs':'',isT?'it':'',isSel?'sl':''].filter(Boolean).join(' ');
              const topLocs=[...new Set(cs.map(s=>s.loc))].slice(0,3);
              return<div key={cd} className={cls} onClick={()=>{
                setSel(isSel?null:cd);
              }}>
                <div className="cn">{+cd.slice(8)}</div>
                {hasS&&<div className="cal-dots">
                  {topLocs.map((loc,j)=><div key={j} style={{width:'5px',height:'5px',borderRadius:'50%',background:venueColor(loc)}}/>)}
                </div>}
                {!hasS&&<div className="cal-add">+</div>}
              </div>;
            })}
          </div>
        </div>

        {sel&&<div className="cdet">
          <div className="cdet-h" style={{cursor:'pointer'}} onClick={()=>setEditShift({date:sel,start:'',end:'',loc:'',note:''})}>
            <div className="cdet-d">{dayName(sel)} {+sel.slice(8)} {mkName(sel.slice(0,7))}{sel===TODAY&&<span className="tdtag" style={{marginLeft:'.5rem'}}>TODAY</span>}</div>
            {selH>0&&<div className="cdet-t">{fmtH(selH)}</div>}
          </div>
          {selS.length===0?<div className="eday" style={{cursor:'pointer'}} onClick={()=>setEditShift({date:sel,start:'',end:'',loc:'',note:''})}>add shift</div>:selS.map(s=><div key={s.id} onClick={e=>{e.stopPropagation();setEditShift(s);}}><ShiftRow s={s} onEdit={setEditShift}/></div>)}
        </div>}

        {/* WEEK BREAKDOWN */}
        <div style={{background:'var(--s1)',border:'1px solid var(--border)',borderLeft:'3px solid var(--accent)',padding:'1rem',marginBottom:'.6rem',borderRadius:'7px'}}>
          <button onClick={()=>setShowWkBreak(v=>!v)} style={{width:'100%',background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',padding:0}}>
            <div style={{fontFamily:'var(--font-d)',fontSize:'1.05rem',letterSpacing:'.06em',color:'var(--accent)'}}>WEEK BREAKDOWN</div>
            <span style={{color:'var(--accent)',fontSize:'.8rem'}}>{showWkBreak?'▴':'▾'}</span>
          </button>
          {showWkBreak&&<div style={{marginTop:'.75rem'}}>
          {mByWeek.length===0&&<div style={{fontFamily:'var(--font-m)',fontSize:'.68rem',color:'var(--muted)'}}>NO SHIFTS THIS MONTH</div>}
          {mByWeek.map(w=>(
            <div key={w.w} className="wsc" style={{marginBottom:'.35rem',padding:'.7rem .85rem'}}>
              <div>
                <div className="wsc-w">WEEK {w.w}</div>
                <div className="wsc-d">{w.shifts.length} shifts · {w.dates.sort()[0].slice(5)} → {w.dates.sort().slice(-1)[0].slice(5)}</div>
                <div style={{height:'3px',background:'var(--dim)',marginTop:'.45rem',width:'120px',borderRadius:'2px'}}>
                  <div style={{height:'100%',background:'var(--accent)',width:`${w.hours/maxWH*100}%`,transition:'width .5s ease',borderRadius:'2px'}}/>
                </div>
              </div>
              <div style={{textAlign:'right'}}>
                <div className="wsc-h">{fmtH(w.hours)}</div>
                <div className="wsc-p">{fmtP(w.pay)}</div>
              </div>
            </div>
          ))}
          </div>}
        </div>

        <div className="locs">
          <div className="loc-t">BY LOCATION</div>
          {Object.entries(mLoc).sort((a,b)=>b[1]-a[1]).map(([l,h])=>(
            <div key={l} className="lr">
              <span className="li">{LICO[l]}</span>
              <span className="ln" style={{color:venueColor(l)}}>{l}</span>
              <div className="lbw"><div className="lb" style={{width:`${h/maxLH*100}%`,background:venueColor(l)}}/></div>
              <span className="lv">{fmtH(h)}</span>
            </div>
          ))}
          {Object.keys(mLoc).length===0&&<div style={{fontFamily:'var(--font-m)',fontSize:'.68rem',color:'var(--muted)'}}>NO DATA</div>}
        </div>

        {mWorkShifts.some(s=>s.loc==='Oseyo')&&<button onClick={()=>exportOseyoTimesheet(mWorkShifts.filter(s=>s.loc==='Oseyo'),vm,store.profileName,store.profileStaff)} style={{width:'100%',background:'var(--s1)',border:'1px solid var(--sky)',color:'var(--sky)',fontFamily:'var(--font-d)',fontSize:'.95rem',letterSpacing:'.06em',padding:'.7rem',borderRadius:'7px',cursor:'pointer',marginTop:'.6rem'}}>📄 EXPORT OSEYO TIMESHEET</button>}
      </div></div>}

      {/* STATS */}
      {tab==='stats'&&<div className="screen"><div className="st-wrap">

        {(()=>{
          // ── FIXED CUSTOM PERIOD ONLY: 3 Aug 2026 → 7 Nov 2027. Anything outside is excluded from stats. ──
          const tyShifts=workShifts.filter(s=>inPeriod(s.date));

          // Build calendar-month buckets
          const monMap={};
          tyShifts.forEach(s=>{
            const k=mkKey(s.date);
            if(!monMap[k])monMap[k]={k,hours:0,shifts:0,pay:0};
            monMap[k].hours+=s.hours;monMap[k].shifts++;monMap[k].pay+=shiftPay(s);
          });
          const months=Object.values(monMap).sort((a,b)=>a.k.localeCompare(b.k));

          const activeTYData={
            hours:tyShifts.reduce((a,s)=>a+s.hours,0),
            pay:tyShifts.reduce((a,s)=>a+shiftPay(s),0),
            shifts:tyShifts.length,
            months
          };
          const taxYears=months.length>0?[1]:[]; // kept only as a "has data" flag for markup below

          // AVG/WEEK: divide by the full period length
          const fyWeeks=PERIOD_TOTAL_WEEKS;
          const avgPerWeek=fyWeeks>0?activeTYData.hours/fyWeeks:0;
          // AVG/WEEK for past weeks only (weeks with at least one shift), excluding the current in-progress week
          const currentWkKey=inPeriod(TODAY)?periodWeekNum(TODAY):null;
          const workedWeekSet=new Set(tyShifts.filter(s=>s.date<TODAY&&periodWeekNum(s.date)!==currentWkKey).map(s=>periodWeekNum(s.date)));
          const workedWeeks=workedWeekSet.size;
          const avgWorkedWeek=workedWeeks>0?tyShifts.filter(s=>s.date<TODAY).reduce((a,s)=>a+s.hours,0)/workedWeeks:0;

          // Total applications logged across the fixed period (weeks keyed by their Monday start date)
          const appTotal=store.application?Object.entries(store.application).reduce((sum,[wk,v])=>{
            if(v==null||!inPeriod(wk))return sum;
            const n=parseFloat(v);
            return isNaN(n)?sum:sum+n;
          },0):0;

          const tyLabel=()=>'3 AUG 2026 – 7 NOV 2027';

          return(<>
            {/* SUMMARY CARDS */}
            <div style={{fontFamily:'var(--font-m)',fontSize:'.55rem',color:'var(--muted)',letterSpacing:'.1em',marginBottom:'.4rem'}}>
              {tyLabel()} OVERVIEW
            </div>
            <div className="stat-split">
              <div className="sp" style={{borderTop:'2px solid var(--accent)'}}><div className="wcv" style={{color:'var(--accent)'}}>{fmtH(activeTYData.hours)}</div><div className="wcl">TOTAL HRS</div></div>
              <div className="sp" style={{borderTop:'2px solid var(--green)'}}><div className="wcv" style={{color:'var(--green)',fontSize:'1.3rem'}}>{fmtP(activeTYData.pay)}</div><div className="wcl">GROSS PAY</div></div>
              <div className="sp" style={{borderTop:'2px solid var(--purple)'}}><div className="wcv" style={{color:'var(--purple)'}}>{appTotal}</div><div className="wcl">APPLICATION</div></div>
            </div>
            <div className="stat-split">
              <div className="sp" style={{borderTop:'2px solid var(--gold)'}}><div className="wcv" style={{color:'var(--gold)'}}>{activeTYData.shifts}</div><div className="wcl">SHIFTS</div></div>
              <div className="sp" style={{borderTop:'2px solid var(--sky)'}}><div className="wcv" style={{color:'var(--sky)',fontSize:'1.3rem'}}>{activeTYData.shifts>0?fmtH(activeTYData.hours/activeTYData.shifts):'—'}</div><div className="wcl">AVG/SHIFT</div></div>
              <div className="sp" style={{borderTop:'2px solid var(--orange)'}}><div className="wcv" style={{color:'var(--orange)',fontSize:'1.3rem'}}>{workedWeeks>0?fmtH(avgWorkedWeek):'—'}</div><div className="wcl">{workedWeeks>0?`AVG (${workedWeeks} WKS)`:'AVG WORKED'}</div></div>
              <div className="sp" style={{borderTop:'2px solid var(--pink)'}}><div className="wcv" style={{color:'var(--pink)',fontSize:'1.3rem'}}>{activeTYData.hours>0?fmtH(avgPerWeek):'—'}</div><div className="wcl">{activeTYData.hours>0?`AVG ÷ ${fyWeeks} WKS`:'AVG/WEEK'}</div></div>
            </div>

            {/* SALARY */}
            {activeTYData.months.length>0&&<div style={{background:'var(--s1)',border:'1px solid var(--border)',borderLeft:'3px solid var(--sky)',padding:'1rem',marginBottom:'.65rem',borderRadius:'7px'}}>
              <button onClick={()=>setShowActualPay(v=>!v)} style={{width:'100%',background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',padding:0,marginBottom:showActualPay?'.65rem':0}}>
                <div style={{fontFamily:'var(--font-d)',fontSize:'1.05rem',letterSpacing:'.06em',color:'var(--sky)'}}>SALARY</div>
                <div style={{display:'flex',alignItems:'center',gap:'.65rem'}}>
                  {(()=>{const totalActualHdr=activeTYData.months.reduce((sum,m)=>{const v=store.actualPay&&store.actualPay[m.k]!=null?parseFloat(store.actualPay[m.k]):null;return v!=null&&!isNaN(v)?sum+v:sum;},0);const filledHdr=activeTYData.months.filter(m=>store.actualPay&&store.actualPay[m.k]!=null&&!isNaN(parseFloat(store.actualPay[m.k]))).length;return filledHdr>0?(<div style={{textAlign:'right'}}><div style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',color:'var(--sky)'}}>{fmtP(totalActualHdr)}</div><div style={{fontFamily:'var(--font-m)',fontSize:'.58rem',color:'var(--muted)'}}>{filledHdr} month{filledHdr!==1?'s':''} logged</div></div>):null;})()}
                  <span style={{color:'var(--sky)',fontSize:'.8rem'}}>{showActualPay?'▴':'▾'}</span>
                </div>
              </button>
              {showActualPay&&<>{[...activeTYData.months].sort((a,b)=>{
                const taxOrd=k=>{const[y,mo]=k.split('-').map(Number);return mo>=4?y*100+mo:(y-1)*100+mo+12;};
                return taxOrd(a.k)-taxOrd(b.k);
              }).map(m=>{
                const actual=store.actualPay&&store.actualPay[m.k]!=null?store.actualPay[m.k]:'';
                const isPastMonth=m.k<TODAY.slice(0,7);
                return <SalaryRow key={m.k} m={m} actual={actual} isPastMonth={isPastMonth} up={up}/>;
              })}
              {(()=>{
                const totalActual=activeTYData.months.reduce((sum,m)=>{
                  const v=store.actualPay&&store.actualPay[m.k]!=null?parseFloat(store.actualPay[m.k]):null;
                  return v!=null&&!isNaN(v)?sum+v:sum;
                },0);
                const filledMonths=activeTYData.months.filter(m=>store.actualPay&&store.actualPay[m.k]!=null&&!isNaN(parseFloat(store.actualPay[m.k]))).length;
                if(filledMonths===0)return null;
                return(
                  <div style={{borderTop:'1px solid var(--border)',paddingTop:'.55rem'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontFamily:'var(--font-m)',fontSize:'.6rem',color:'var(--sky)',letterSpacing:'.06em'}}>TOTAL RECEIVED ({filledMonths} month{filledMonths!==1?'s':''})</span>
                      <span style={{fontFamily:'var(--font-d)',fontSize:'1.2rem',color:'var(--sky)'}}>{fmtP(totalActual)}</span>
                    </div>
                  </div>
                );
              })()}</>}
            </div>}

            {/* INVESTMENT */}
            {activeTYData.months.length>0&&<div style={{background:'var(--s1)',border:'1px solid var(--border)',borderLeft:'3px solid var(--green)',padding:'1rem',marginBottom:'.65rem',borderRadius:'7px'}}>
              <button onClick={()=>setShowInvestment(v=>!v)} style={{width:'100%',background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',padding:0,marginBottom:showInvestment?'.65rem':0}}>
                <div style={{fontFamily:'var(--font-d)',fontSize:'1.05rem',letterSpacing:'.06em',color:'var(--green)'}}>INVESTMENT</div>
                <div style={{display:'flex',alignItems:'center',gap:'.65rem'}}>
                  {(()=>{const totalInvHdr=activeTYData.months.reduce((sum,m)=>{const v=store.investment&&store.investment[m.k]!=null?parseFloat(store.investment[m.k]):null;return v!=null&&!isNaN(v)?sum+v:sum;},0);const filledInvHdr=activeTYData.months.filter(m=>store.investment&&store.investment[m.k]!=null&&!isNaN(parseFloat(store.investment[m.k]))).length;return filledInvHdr>0?(<div style={{textAlign:'right'}}><div style={{fontFamily:'var(--font-d)',fontSize:'1.1rem',color:'var(--green)'}}>{fmtP(totalInvHdr)}</div><div style={{fontFamily:'var(--font-m)',fontSize:'.58rem',color:'var(--muted)'}}>{filledInvHdr} month{filledInvHdr!==1?'s':''} logged</div></div>):null;})()}
                  <span style={{color:'var(--green)',fontSize:'.8rem'}}>{showInvestment?'▴':'▾'}</span>
                </div>
              </button>
              {showInvestment&&<>{[...activeTYData.months].sort((a,b)=>{
                const taxOrd=k=>{const[y,mo]=k.split('-').map(Number);return mo>=4?y*100+mo:(y-1)*100+mo+12;};
                return taxOrd(a.k)-taxOrd(b.k);
              }).map(m=>{
                const invest=store.investment&&store.investment[m.k]!=null?store.investment[m.k]:'';
                const isPastMonth=m.k<TODAY.slice(0,7);
                return <InvestmentRow key={m.k} m={m} invest={invest} isPastMonth={isPastMonth} up={up}/>;
              })}
              {(()=>{
                const totalInv=activeTYData.months.reduce((sum,m)=>{
                  const v=store.investment&&store.investment[m.k]!=null?parseFloat(store.investment[m.k]):null;
                  return v!=null&&!isNaN(v)?sum+v:sum;
                },0);
                const filledInv=activeTYData.months.filter(m=>store.investment&&store.investment[m.k]!=null&&!isNaN(parseFloat(store.investment[m.k]))).length;
                if(filledInv===0)return null;
                return(
                  <div style={{borderTop:'1px solid var(--border)',paddingTop:'.55rem'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontFamily:'var(--font-m)',fontSize:'.6rem',color:'var(--green)',letterSpacing:'.06em'}}>TOTAL INVESTED ({filledInv} month{filledInv!==1?'s':''})</span>
                      <span style={{fontFamily:'var(--font-d)',fontSize:'1.2rem',color:'var(--green)'}}>{fmtP(totalInv)}</span>
                    </div>
                  </div>
                );
              })()}</>}
            </div>}

            {taxYears.length===0&&<div style={{fontFamily:'var(--font-m)',fontSize:'.68rem',color:'var(--muted)'}}>NO DATA YET</div>}

            {/* Location breakdown for selected year */}
            <div className="locs">
              <div className="loc-t">BY LOCATION · {tyLabel()}</div>
              {(()=>{
                const lt={};const lp={};
                tyShifts.forEach(s=>{lt[s.loc]=(lt[s.loc]||0)+s.hours;lp[s.loc]=(lp[s.loc]||0)+shiftPay(s);});
                const mx=Math.max(1,...Object.values(lt));
                if(Object.keys(lt).length===0)return<div style={{fontFamily:'var(--font-m)',fontSize:'.68rem',color:'var(--muted)'}}>NO DATA</div>;
                return Object.entries(lt).sort((a,b)=>b[1]-a[1]).map(([l,h])=>{
                  const isSel=selLoc===l;
                  const locShifts=tyShifts.filter(s=>s.loc===l).sort((a,b)=>b.date.localeCompare(a.date)||b.start.localeCompare(a.start));
                  const col=venueColor(l);
                  return(<div key={l}>
                    <div className="lr" style={{cursor:'pointer',padding:'.3rem .2rem',borderRadius:'5px',transition:'background .1s'}} onClick={()=>setSelLoc(isSel?null:l)}>
                      <span className="li">{LICO[l]}</span>
                      <span className="ln" style={{color:col}}>{l}</span>
                      <div className="lbw"><div className="lb" style={{width:`${h/mx*100}%`,background:col}}/></div>
                      <span className="lv">{fmtH(h)}</span>
                      <span style={{fontFamily:'var(--font-m)',fontSize:'.65rem',color:isSel?col:'var(--dim)',marginLeft:'.3rem',transition:'color .15s'}}>{isSel?'▴':'▾'}</span>
                    </div>
                    {isSel&&<div style={{background:'var(--bg)',border:`1px solid ${col}33`,borderRadius:'6px',marginBottom:'.5rem',overflow:'hidden'}}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'.5rem .75rem',background:`${col}11`,borderBottom:`1px solid ${col}22`}}>
                        <span style={{fontFamily:'var(--font-b)',fontSize:'.85rem',fontWeight:700,color:col}}>{locShifts.length} SHIFTS</span>
                        <span style={{fontFamily:'var(--font-d)',fontSize:'1rem',color:'var(--green)'}}>{fmtP(lp[l])}</span>
                      </div>
                      {locShifts.map(s=>{
                        return(<div key={s.id} style={{display:'flex',alignItems:'center',gap:'.6rem',padding:'.5rem .75rem',borderBottom:'1px solid var(--border)',cursor:'pointer',transition:'background .1s'}}
                          onClick={()=>setEditShift(s)}
                          onMouseEnter={e=>e.currentTarget.style.background='var(--s2)'}
                          onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                          <div style={{width:'3px',alignSelf:'stretch',background:col,borderRadius:'2px',flexShrink:0}}/>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontFamily:'var(--font-d)',fontSize:'.95rem',color:'var(--text)',letterSpacing:'.03em'}}>{dayName(s.date)} {+s.date.slice(8)} {mkName(s.date.slice(0,7))}</div>
                            <div style={{fontFamily:'var(--font-m)',fontSize:'.62rem',color:'var(--muted)',marginTop:'1px'}}>{s.start} – {s.end}{s.note?` · 📝 ${s.note}`:''}</div>
                          </div>
                          <div style={{textAlign:'right',flexShrink:0}}>
                            <div style={{fontFamily:'var(--font-d)',fontSize:'1rem',color:col}}>{fmtH(s.hours)}</div>
                            <div style={{fontFamily:'var(--font-m)',fontSize:'.6rem',color:'var(--green)'}}>{fmtP(shiftPay(s))}</div>
                          </div>
                        </div>);
                      })}
                    </div>}
                  </div>);
                });
              })()}
            </div>
          </>);
        })()}
      </div></div>}

      {/* NAV */}
      <div className="bnav">
        {[{id:'week',ico:'📅',lbl:'WEEK'},{id:'monthly',ico:'🗓️',lbl:'MONTH'},{id:'stats',ico:'📊',lbl:'STATS'}].map(n=>(
          <button key={n.id} className={`bni ${tab===n.id?'act':''}`} onClick={()=>switchTab(n.id)}>
            <span className="bni-ico">{n.ico}</span>{n.lbl}
          </button>
        ))}
      </div>
    </div>

    {/* EDIT SHIFT MODAL */}
    {editShift&&<EditModal shift={editShift} onSave={saveEdit} onDelete={delShift} onClose={()=>setEditShift(null)}/>}

    {/* SAVE FLASH */}
    {saveFlash&&<div style={{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,pointerEvents:'none'}}>
      <div className="save-flash" style={{background:'var(--green)',color:'#fff',fontFamily:'var(--font-d)',fontSize:'1.4rem',letterSpacing:'.1em',padding:'.6rem 1.5rem',borderRadius:'8px',boxShadow:'0 0 30px rgba(29,185,84,.4)'}}>✓ SAVED</div>
    </div>}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
