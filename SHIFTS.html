@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,229,255,.1)}50%{box-shadow:0 0 18px 5px rgba(0,229,255,.25)}}
@keyframes lpress{0%{transform:scale(1)}50%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;}

/* TOP */
.topbar{background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;padding-top:env(safe-area-inset-top,0);}
.tb-inner{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;}
.title{font-family:var(--font-d);font-size:1.8rem;letter-spacing:.1em;color:var(--text);}
.title span{color:var(--accent);}

/* SCREEN + NAV */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(68px + env(safe-area-inset-bottom,0));}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--border);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom,0);}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;padding:.55rem .25rem;cursor:pointer;border:none;background:none;color:var(--muted);font-family:var(--font-m);font-size:.52rem;letter-spacing:.06em;gap:.18rem;transition:color .2s;}
.bni.act{color:var(--accent);}
.bni-ico{font-size:1.05rem;line-height:1;}


/* WEEK */
.w-wrap{padding:.85rem .85rem 0;animation:up .2s ease;}
.who{display:flex;background:var(--s1);border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:.65rem;}
.wc{flex:1;min-width:0;padding:.65rem .4rem;text-align:center;}
.wc+.wc{border-left:1px solid var(--border);}
.wcv{font-family:var(--font-d);font-size:1.5rem;letter-spacing:.04em;line-height:1;}
.wcl{font-family:var(--font-m);font-size:.58rem;color:var(--muted);margin-top:.25rem;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* DAY BLOCK */
.db{background:var(--s1);border:1px solid var(--border);margin-bottom:.5rem;overflow:hidden;border-radius:8px;}
.db.td{border-color:rgba(0,229,255,.65);border-width:1.5px;animation:glow 3s ease-in-out infinite;}
.dbh{display:flex;justify-content:space-between;align-items:center;padding:.6rem .9rem;background:var(--s2);border-bottom:1px solid var(--border);transition:background .1s;}
.dbh:active{background:var(--s3);}
.db.td .dbh{background:rgba(0,229,255,.07);}
.dbh-d{font-family:var(--font-d);font-size:1.2rem;letter-spacing:.06em;color:var(--text2);}
.dbh-t{font-family:var(--font-d);font-size:1.2rem;color:var(--accent);}
.tdtag{font-family:var(--font-m);font-size:.52rem;background:var(--accent);color:#000;padding:.12rem .38rem;letter-spacing:.08em;font-weight:700;margin-left:.45rem;border-radius:3px;vertical-align:middle;}

/* SHIFT ROW — tap to edit */
.sr-wrap{position:relative;overflow:hidden;border-bottom:1px solid var(--border);}
.sr-wrap:last-child{border-bottom:none;}
.sr{display:flex;align-items:center;gap:.7rem;padding:.82rem .9rem;animation:up .15s ease;background:var(--bg);position:relative;user-select:none;cursor:pointer;transition:background .1s;}
.sr:active{background:var(--s2);}
.sr-bar{width:3px;min-height:40px;border-radius:2px;flex-shrink:0;align-self:stretch;}
.sr-info{flex:1;min-width:0;}
.sr-line{display:flex;align-items:center;gap:.5rem;flex-wrap:nowrap;overflow:hidden;}
.sr-time{font-family:var(--font-m);font-size:1.08rem;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0;letter-spacing:.01em;}
.sr-dot{font-size:.9rem;color:var(--muted);flex-shrink:0;}
.sr-ico{font-size:1.05rem;flex-shrink:0;}
.sr-venue{font-family:var(--font-b);font-size:1.08rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-note{font-family:var(--font-m);font-size:.6rem;color:var(--muted);margin-top:.25rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-right{text-align:right;flex-shrink:0;}
.sr-hrs{font-family:var(--font-d);font-size:1.35rem;line-height:1;}
.sr-pay{font-family:var(--font-m);font-size:.68rem;color:var(--green);margin-top:1px;}
.eday{padding:.7rem .9rem;font-family:var(--font-m);font-size:.7rem;color:var(--muted);}

/* MONTH */
.m-wrap{padding:.85rem .85rem 0;animation:up .2s ease;}

/* CALENDAR — EXPENSES style */
.cal{background:var(--s1);border:1px solid var(--border);margin-bottom:.6rem;overflow:hidden;border-radius:8px;padding:.6rem;}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:.25rem;}
.cal-dow{font-family:var(--font-m);font-size:.52rem;color:var(--muted);text-align:center;padding:.2rem 0;letter-spacing:.04em;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cc{aspect-ratio:1;background:var(--s1);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative;}
.cc:active{border-color:var(--accent);}
.cc.om{background:transparent;border-color:transparent;cursor:default;}
.cc.it{border-color:var(--accent);}
.cc.sl{border-color:var(--gold);background:rgba(255,214,0,.06);}
.cc.hs{background:var(--s2);}
.cn{font-family:var(--font-d);font-size:.85rem;color:var(--muted);line-height:1;}
.cc.hs .cn{color:var(--text);}
.cc.it .cn{color:var(--accent);font-weight:700;}
.cc.om .cn{color:var(--dim);}
.cal-dots{display:flex;gap:1px;margin-top:2px;}
.cal-add{font-size:.6rem;color:var(--dim);margin-top:2px;}

.cdet{background:var(--s1);border:1px solid var(--border);border-left:3px solid var(--accent);margin-bottom:.6rem;overflow:hidden;animation:up .15s ease;border-radius:7px;}
.cdet-h{padding:.65rem .9rem;background:rgba(0,229,255,.07);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.cdet-d{font-family:var(--font-d);font-size:1.15rem;letter-spacing:.06em;color:var(--text);}
.cdet-t{font-family:var(--font-d);font-size:1.15rem;color:var(--accent);}

/* WEEK BREAKDOWN */
.wsc{background:var(--s1);border:1px solid var(--border);padding:.82rem 1rem;margin-bottom:.4rem;display:flex;align-items:center;justify-content:space-between;border-radius:7px;}
.wsc-w{font-family:var(--font-d);font-size:1.15rem;letter-spacing:.06em;color:var(--text);}
.wsc-d{font-family:var(--font-m);font-size:.62rem;color:var(--muted);margin-top:2px;}
.wsc-h{font-family:var(--font-d);font-size:1.4rem;color:var(--accent);}
.wsc-p{font-family:var(--font-m);font-size:.68rem;color:var(--green);margin-top:2px;}

/* LOC BARS */
.locs{background:var(--s1);border:1px solid var(--border);padding:1rem;margin-bottom:.6rem;border-radius:7px;}
.loc-t{font-family:var(--font-d);font-size:1.05rem;letter-spacing:.06em;color:var(--muted);margin-bottom:.75rem;}
.lr{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;}
.li{font-size:.95rem;width:22px;text-align:center;flex-shrink:0;}
.ln{font-family:var(--font-b);font-weight:700;font-size:.95rem;min-width:92px;}
.lbw{flex:1;height:5px;background:var(--dim);border-radius:2px;}
.lb{height:100%;transition:width .4s ease;border-radius:2px;}
.lv{font-family:var(--font-m);font-size:.68rem;min-width:40px;text-align:right;color:var(--text2);}

/* STATS */
.st-wrap{padding:.85rem .85rem 0;animation:up .2s ease;}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.65rem;}
.stc{background:var(--s1);border:1px solid var(--border);padding:.9rem;border-radius:8px;text-align:center;}
.stat-split{display:flex;background:var(--s1);border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:.5rem;}
.stat-split>.sp{flex:1;min-width:0;padding:.65rem .4rem;text-align:center;}
.stat-split>.sp+.sp{border-left:1px solid var(--border);}
.stv{font-family:var(--font-d);font-size:1.8rem;letter-spacing:.04em;color:var(--text);line-height:1;}
.stl{font-family:var(--font-m);font-size:.58rem;color:var(--muted);margin-top:.25rem;letter-spacing:.07em;}
.pb{background:var(--s1);border:1px solid var(--border);border-left:3px solid var(--green);padding:1rem;margin-bottom:.65rem;border-radius:7px;}
.pb-r{display:flex;justify-content:space-between;align-items:center;padding:.38rem 0;border-bottom:1px solid var(--border);}
.pb-r:last-child{border-bottom:none;}


/* weekly target progress */
.wtarget{background:var(--s1);border:1px solid var(--border);border-left:3px solid var(--purple);padding:.75rem 1rem;margin-bottom:.65rem;border-radius:7px;}
.wt-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.45rem;}
.wt-lbl{font-family:var(--font-m);font-size:.6rem;color:var(--muted);letter-spacing:.08em;}
.wt-val{font-family:var(--font-d);font-size:1rem;color:var(--purple);}
.wt-bar{height:6px;background:var(--dim);border-radius:3px;overflow:hidden;}
.wt-fill{height:100%;border-radius:3px;transition:width .5s ease;}

/* save flash */
@keyframes savePop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.save-flash{animation:savePop .35s ease;}


/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.25rem;}
.mdl{background:var(--bg);border:1px solid var(--border);padding:1rem;width:100%;max-width:340px;animation:pop .2s ease;border-radius:9px;max-height:90vh;overflow-y:auto;}
.mdl-t{font-family:var(--font-d);font-size:1.6rem;letter-spacing:.06em;margin-bottom:.25rem;color:var(--text);}
.mdl-s{font-family:var(--font-m);font-size:.65rem;color:var(--muted);margin-bottom:.75rem;}
.mdl-box{background:var(--s1);border:1px solid var(--border);padding:.85rem 1rem;border-radius:7px;margin-bottom:.5rem;}
.mdl-l{font-family:var(--font-m);font-size:.65rem;color:var(--accent);letter-spacing:.1em;margin-bottom:.45rem;}
.mdl-l+.mdl-l{margin-top:.65rem;}
.mdl-i-sm{width:100%;background:var(--s3);border:1px solid var(--border2);color:var(--text);font-family:var(--font-m);font-size:.88rem;padding:.5rem .65rem;border-radius:4px;}
.mdl-i-sm:focus{outline:none;border-color:var(--accent);}
.mdl-trow{display:grid;grid-template-columns:1fr 20px 1fr;gap:.4rem;align-items:center;}
.mdl-tsep{font-family:var(--font-d);font-size:1.1rem;color:var(--muted);text-align:center;}
.mdl-lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;}
.mdl-lbtn{display:flex;align-items:center;gap:.25rem;padding:.45rem .35rem;border:1px solid var(--border2);background:var(--s2);cursor:pointer;font-family:var(--font-b);font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;border-radius:4px;transition:all .15s;}
.mdl-lbtn.sel{background:rgba(255,255,255,.05);}
.mdl-notes{width:100%;background:var(--s3);border:1px solid var(--border2);color:var(--text);font-family:var(--font-m);font-size:.78rem;padding:.48rem .65rem;border-radius:4px;resize:none;line-height:1.4;}
.mdl-notes:focus{outline:none;border-color:var(--accent);}
.mdl-notes::placeholder{color:var(--muted);}
.mdl-save{width:100%;font-family:var(--font-d);font-size:1.3rem;letter-spacing:.1em;padding:.75rem;border:none;cursor:pointer;background:var(--green);color:#fff;border-radius:5px;margin-top:.25rem;transition:all .15s;}
.mdl-save:disabled{background:var(--green);color:#fff;cursor:default;opacity:1;}
